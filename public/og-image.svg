<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#0DF23E" stroke-width="0.6" opacity="0.07"/>
    </pattern>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0DF23E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0DF23E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0DF23E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0DF23E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ball">
      <circle cx="930" cy="315" r="175"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a150d"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <ellipse cx="180" cy="315" rx="380" ry="320" fill="url(#glowL)"/>
  <ellipse cx="930" cy="315" rx="280" ry="280" fill="url(#glowR)"/>

  <!-- Left accent bar -->
  <rect x="82" y="175" width="6" height="280" rx="3" fill="#0DF23E"/>
  <circle cx="85" cy="175" r="5" fill="#0DF23E"/>
  <circle cx="85" cy="455" r="5" fill="#0DF23E"/>

  <!-- Eyebrow label -->
  <text x="114" y="220"
    font-family="Arial Black, Arial, sans-serif"
    font-size="15" font-weight="800"
    fill="#0DF23E" letter-spacing="7" opacity="0.85">
    FUTSAL MANAGER
  </text>

  <!-- Main title -->
  <text x="110" y="345"
    font-family="Arial Black, Arial, sans-serif"
    font-size="102" font-weight="900"
    fill="white">
    풋살 매니저
  </text>

  <!-- Divider line -->
  <rect x="110" y="368" width="480" height="2" rx="1" fill="#0DF23E" opacity="0.3"/>

  <!-- Tagline -->
  <text x="112" y="415"
    font-family="Arial, sans-serif"
    font-size="22" fill="rgba(255,255,255,0.42)" letter-spacing="0.5">
    팀 배정 · 경기 일정 · 출석 기록을 한 곳에
  </text>

  <!-- Feature pills -->
  <rect x="112" y="448" width="106" height="30" rx="15" fill="rgba(13,242,62,0.1)" stroke="rgba(13,242,62,0.3)" stroke-width="1"/>
  <text x="165" y="468" font-family="Arial, sans-serif" font-size="13" fill="#0DF23E" text-anchor="middle" font-weight="700">팀 배정</text>

  <rect x="230" y="448" width="106" height="30" rx="15" fill="rgba(13,242,62,0.1)" stroke="rgba(13,242,62,0.3)" stroke-width="1"/>
  <text x="283" y="468" font-family="Arial, sans-serif" font-size="13" fill="#0DF23E" text-anchor="middle" font-weight="700">경기 일정</text>

  <rect x="348" y="448" width="106" height="30" rx="15" fill="rgba(13,242,62,0.1)" stroke="rgba(13,242,62,0.3)" stroke-width="1"/>
  <text x="401" y="468" font-family="Arial, sans-serif" font-size="13" fill="#0DF23E" text-anchor="middle" font-weight="700">출석 기록</text>

  <!-- ─── Soccer Ball (right side) ─── -->
  <!-- Outer ring -->
  <circle cx="930" cy="315" r="175" fill="rgba(13,242,62,0.04)" stroke="rgba(13,242,62,0.22)" stroke-width="3"/>
  <circle cx="930" cy="315" r="160" fill="none" stroke="rgba(13,242,62,0.08)" stroke-width="1"/>

  <!-- Center pentagon -->
  <polygon
    points="930,230 1003,278 976,368 884,368 857,278"
    fill="rgba(13,242,62,0.18)" stroke="rgba(13,242,62,0.5)" stroke-width="2"
  />

  <!-- Lines from pentagon to ball edge (clipped) -->
  <line x1="930" y1="230" x2="930" y2="140" stroke="rgba(13,242,62,0.25)" stroke-width="2" clip-path="url(#ball)"/>
  <line x1="1003" y1="278" x2="1095" y2="248" stroke="rgba(13,242,62,0.25)" stroke-width="2" clip-path="url(#ball)"/>
  <line x1="976" y1="368" x2="1065" y2="462" stroke="rgba(13,242,62,0.25)" stroke-width="2" clip-path="url(#ball)"/>
  <line x1="884" y1="368" x2="795" y2="462" stroke="rgba(13,242,62,0.25)" stroke-width="2" clip-path="url(#ball)"/>
  <line x1="857" y1="278" x2="765" y2="248" stroke="rgba(13,242,62,0.25)" stroke-width="2" clip-path="url(#ball)"/>

  <!-- Top hexagon -->
  <polygon
    points="930,140 990,158 1010,220 970,260 890,260 850,220 870,158"
    fill="rgba(13,242,62,0.09)" stroke="rgba(13,242,62,0.28)" stroke-width="1.5"
    clip-path="url(#ball)"
  />
  <!-- Top-right hexagon -->
  <polygon
    points="1095,248 1100,315 1085,375 1040,400 1010,360 1035,295"
    fill="rgba(13,242,62,0.09)" stroke="rgba(13,242,62,0.28)" stroke-width="1.5"
    clip-path="url(#ball)"
  />
  <!-- Bottom-right hexagon -->
  <polygon
    points="1065,462 1020,490 970,480 950,440 980,400 1030,415"
    fill="rgba(13,242,62,0.09)" stroke="rgba(13,242,62,0.28)" stroke-width="1.5"
    clip-path="url(#ball)"
  />
  <!-- Bottom-left hexagon -->
  <polygon
    points="795,462 760,420 780,378 830,375 860,415 840,455"
    fill="rgba(13,242,62,0.09)" stroke="rgba(13,242,62,0.28)" stroke-width="1.5"
    clip-path="url(#ball)"
  />
  <!-- Top-left hexagon -->
  <polygon
    points="765,248 820,220 860,255 840,315 790,335 748,300"
    fill="rgba(13,242,62,0.09)" stroke="rgba(13,242,62,0.28)" stroke-width="1.5"
    clip-path="url(#ball)"
  />
</svg>
