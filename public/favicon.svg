<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#122b17"/>
      <stop offset="100%" stop-color="#0a150d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0DF23E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0DF23E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Glow -->
  <ellipse cx="32" cy="28" rx="30" ry="30" fill="url(#glow)" clip-path="url(#clip)"/>

  <!-- Soccer ball circle -->
  <circle cx="32" cy="30" r="18" fill="none" stroke="#0DF23E" stroke-width="1.8" opacity="0.9"/>

  <!-- Center pentagon (simplified) -->
  <polygon
    points="32,20 38,24.5 35.5,31.5 28.5,31.5 26,24.5"
    fill="#0DF23E" opacity="0.85"
    stroke="#0DF23E" stroke-width="0.5"
  />

  <!-- Lines from pentagon to edge -->
  <line x1="32" y1="20" x2="32" y2="12" stroke="#0DF23E" stroke-width="1.4" opacity="0.5"/>
  <line x1="38" y1="24.5" x2="46" y2="21" stroke="#0DF23E" stroke-width="1.4" opacity="0.5"/>
  <line x1="35.5" y1="31.5" x2="42" y2="38" stroke="#0DF23E" stroke-width="1.4" opacity="0.5"/>
  <line x1="28.5" y1="31.5" x2="22" y2="38" stroke="#0DF23E" stroke-width="1.4" opacity="0.5"/>
  <line x1="26" y1="24.5" x2="18" y2="21" stroke="#0DF23E" stroke-width="1.4" opacity="0.5"/>

  <!-- App label -->
  <text
    x="32" y="56"
    font-family="Arial Black, Arial, sans-serif"
    font-size="7" font-weight="900"
    fill="#0DF23E" text-anchor="middle"
    letter-spacing="1.5" opacity="0.85"
  >FUTSAL</text>
</svg>
